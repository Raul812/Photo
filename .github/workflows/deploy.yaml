name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install exiftool and ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y libimage-exiftool-perl imagemagick

      - name: Generate photo manifest
        run: node scripts/build-manifest.js

      - name: Assemble site
        run: |
          mkdir -p _site
          for f in index.html style.css app.js photos.json photos CNAME .nojekyll favicon.ico favicon.png favicon.svg apple-touch-icon.png; do
            if [ -e "$f" ]; then cp -R "$f" _site/; fi
          done
          
          # 拷贝原始照片到 _site 目录
          mkdir -p _site/photos
          cp -R photos/* _site/photos/
          
          # 自动压缩 _site 里的照片（保留 EXIF）
          find _site/photos -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) -exec mogrify -resize 2560x2560\> -quality 82 -define exif:preserve=true {} \;

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4