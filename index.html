<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0a0b">
<title>Photography</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>

<header class="topbar" id="topbar">
  <a class="brand" href="./">PHOTOGRAPHY</a>
  <span class="count" id="count"></span>
</header>
  
<section class="intro">
    <h1 class="intro__name">RAUL</h1>
    <p class="intro__desc">A quiet archive of captured light.</p>
    <a href="mailto:1183855213@qq.com" class="intro__email">1183855213@qq.com</a>
</section>
  
<main class="gallery" id="gallery" aria-label="摄影作品"></main>

<p class="empty" id="empty" hidden>
  还没有照片。把图片放进 <code>photos/</code> 文件夹即可。
</p>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true"
     aria-hidden="true" aria-label="照片查看器">
  <button class="lb-close" id="lb-close" type="button" aria-label="关闭">&times;</button>
  <button class="lb-nav lb-prev" id="lb-prev" type="button" aria-label="上一张">&#8249;</button>
  <button class="lb-nav lb-next" id="lb-next" type="button" aria-label="下一张">&#8250;</button>

  <figure class="lb-figure">
    <img class="lb-img" id="lb-img" alt="" draggable="false">
    <figcaption class="lb-meta">
      <span id="lb-date"></span>
      <span id="lb-camera"></span>
      <span id="lb-counter"></span>
    </figcaption>
  </figure>
</div>

<script src="app.js"></script>
</body>
</html>
